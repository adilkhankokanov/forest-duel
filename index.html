function makeNoise(){
  const p=new Uint8Array(512),g=[];for(let i=0;i<256;i++){p[i]=i;const a=Math.random()*Math.PI*2;g.push([Math.cos(a),Math.sin(a)])}
  for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  for(let i=0;i<256;i++)p[i+256]=p[i];
  const f=t=>t*t*t*(t*(t*6-15)+10);
  return(x,y)=>{const X=Math.floor(x),Y=Math.floor(y),xf=x-X,yf=y-Y,xi=X&255,yi=Y&255;
    const d=(h,dx,dy)=>{const v=g[h];return v[0]*dx+v[1]*dy};
    const a=d(p[p[xi]+yi],xf,yf),b=d(p[p[xi+1]+yi],xf-1,yf),c=d(p[p[xi]+yi+1],xf,yf-1),e=d(p[p[xi+1]+yi+1],xf-1,yf-1);
    const u=f(xf),v=f(yf);return(a+(b-a)*u)+((c+(e-c)*u)-(a+(b-a)*u))*v;}
}

const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const Fr=r=>1+CFG.rankStep*(r-1);
const cellKey=(x,z)=>(Math.floor(x/0.5)+20)*1000+(Math.floor(z/0.5)+40);

function mkSide(id){
  const p=id==='p';
  return{id,dir:p?-1:1,x:0,tx:0,cd:CFG.cannon.interval,dmgMul:1,rateMul:1,dmgPicks:0,ratePicks:0,

    aiT:0,choice:-1,style:['squad','giant','defense','economy'][Math.floor(Math.random()*4)]};

function genTrees(){
  const T=CFG.tree,dn=makeNoise(),gn=makeNoise(),trees=[],grid=new Map();
  const peds=[-CFG.pedestal.x,CFG.pedestal.x];
  const near=(x,z)=>{for(let ix=-1;ix<=1;ix++)for(let iz=-1;iz<=1;iz++){const a=grid.get(cellKey(x+ix*.5,z+iz*.5));if(a)for(const t of a)if((t.x-x)**2+(t.z-z)**2<T.minDist*T.minDist)return true}return false};
  for(let i=0;i<40000&&trees.length<T.max;i++){
    const x=rnd(T.xMin,T.xMax),z=rnd(T.zMin,T.zMax);
    if(Math.abs(x)<T.roadHalf)continue;
    if(peds.some(px=>Math.hypot(x-px,z-CFG.pedestal.z)<T.pedestalClear))continue;
    if(dn(x*T.densityFreq+11.3,z*T.densityFreq+7.1)<T.densityCut)continue;
    if(near(x,z))continue;
    const t={x,z,hp:0,max:0,g:false,dead:false,hit:0,gv:gn(x*T.goldFreq+50,z*T.goldFreq+50)+rnd(-.08,.08)};
    trees.push(t);const k=cellKey(x,z);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(t);
  }
  // golden belts: same golden count per belt on both halves, positions from noise
  const belts={};
  for(const t of trees){
    const c=clamp(1-Math.abs(t.z-T.midZ)/T.centerSpan,0,1),b=Math.min(3,Math.floor(c*4)),h=t.z<T.midZ?'e':'p';
    (belts[b+h]=belts[b+h]||[]).push(t);
  }
  for(let b=0;b<4;b++){
    const A=belts[b+'e']||[],B=belts[b+'p']||[];
    const k=Math.round(T.beltGold[b]*(A.length+B.length)/2);
    for(const L of[A,B]){L.sort((u,v)=>v.gv-u.gv);L.forEach((t,i)=>t.g=i<k)}
  }
  for(const t of trees){const s=t.g?T.golden:T.green;t.hp=t.max=s.hp}
  trees.sort((a,b)=>a.z-b.z);
  return{trees,grid};
}
function reset(){
  const{trees,grid}=genTrees();
  G={time:0,trees,grid,treesInit:trees.length,units:[],bullets:[],rockets:[],waves:[],fences:[],
    peds:[-1,1].map(s=>({x:s*CFG.pedestal.x,z:CFG.pedestal.z,hp:CFG.pedestal.hp,dead:false,hit:0})),
    shells:[],booms:[],barrels:[],slicks:[],texts:[],parts:[],rush:false,rushT:0,state:'play',endT:0,P:mkSide('p'),E:mkSide('e')};
  acc=0;paused=false;
}

function restore(d){
  if(!d||!d.G||!d.G.trees){reset();return}
  G=d.G;G.grid=new Map();for(const t of G.trees){const k=cellKey(t.x,t.z);if(!G.grid.has(k))G.grid.set(k,[]);G.grid.get(k).push(t)}
  G.texts=[];G.parts=[];G.shells=G.shells||[];G.booms=G.booms||[];G.barrels=G.barrels||[];G.slicks=G.slicks||[];for(const w of G.waves)w.hit=new Set();acc=0;
}

function upgInfo(s,type){
  switch(type){
    case'dmg':return{t:'Урон',v:'+'+Math.round(upInc(CFG.dmgUp,s.dmgPicks)*100)+'%'};
    case'rate':return{t:'Скорость',v:'+'+Math.round(upInc(CFG.rateUp,s.ratePicks)*100)+'%'};
    case'doubles':return{t:'Двойные',v:fmt(CFG.doubles.dur+CFG.doubles.durStep*(s.rank.doubles-1))+' с'};
    case'squad':return{t:'Отряд',v:'×'+Math.round(CFG.squad.base*Fr(s.rank.squad))};

    case'wave':return{t:'Волна',v:fmt(CFG.wave.dmg*Fr(s.rank.wave))+' урона'};
    case'barrel':return{t:'Бочка',v:'пятно '+fmt(CFG.barrel.slickTime)+' с'};
    case'fence':return{t:'Забор',v:'шир. '+fmt(Math.min(CFG.fence.widthMax,CFG.fence.width*Fr(s.rank.fence)))};

function available(s,type){
  const foeId=s.id==='p'?'e':'p';
  if(type==='dmg')return s.dmgPicks<CFG.dmgUp.maxPicks;
  if(type==='rate')return s.ratePicks<CFG.rateUp.maxPicks;
  if(type==='wave')return aliveUnits(foeId)>0;
  if(type==='fence')return aliveUnits(foeId)>0&&fencesOf(s.id)<CFG.fence.maxAlive;
  return true;
}
function fillBag(s){s.bag=[];for(const k in CFG.bag)for(let i=0;i<CFG.bag[k];i++)s.bag.push(k);shuffle(s.bag)}
function drawPair(s){
  for(let tries=0;tries<2;tries++){
    const av=s.bag.filter(t=>available(s,t)),a=av[0],b=av.find(t=>t!==a);
    if(a&&b){s.bag.splice(s.bag.indexOf(a),1);s.bag.splice(s.bag.indexOf(b),1);return[a,b]}
    fillBag(s);
  }
  return['squad','giant'];
}
function placeFlasks(s){
  const C=CFG.flask,L=C.xLimit,X=s.x;let a=X-C.side,b=X+C.side;
  if(a<-L){a=Math.min(X+C.side*.6,L-C.minGap);b=Math.max(a+C.minGap,Math.min(L,X+C.side*1.7));if(b>L){b=L;a=b-C.minGap}}
  else if(b>L){b=Math.max(X-C.side*.6,-L+C.minGap);a=Math.min(b-C.minGap,Math.max(-L,X-C.side*1.7));if(a<-L){a=-L;b=a+C.minGap}}
  return[a,b];
}

function spawnArmy(s,giant,n){for(let i=0;i<n;i++)s.reserve.push({giant,i,rank:s.rank.giant})}
function makeUnit(s,spec){
  const S=CFG.soldier,Gc=CFG.giant,z0=s.front+s.dir*CFG.army.spawnOffset;
  if(spec.giant){const F=Fr(spec.rank),k=Math.sqrt(F);
    return{side:s.id,giant:true,x:0,z:z0,vx:0,vz:0,r:Gc.radius,m:Gc.mass,hp:Gc.hp*k,max:Gc.hp*k,dmg:Gc.dmg*k,
      atk:Gc.atkInterval,spd:Gc.speed,cd:0,dmgAcc:0,slow:0,walk:0,hit:0,vis:1+Math.min(Gc.sizeMax,Gc.sizeStep*(spec.rank-1)),killer:null};}
  const a=spec.i*CFG.army.spiralAngle,rr=CFG.army.spiralR*Math.sqrt(spec.i);
  return{side:s.id,giant:false,x:Math.cos(a)*rr,z:z0+Math.sin(a)*rr,vx:0,vz:0,r:S.radius,m:S.mass,hp:S.hp,max:S.hp,
    atk:S.atkInterval,spd:S.speed,cd:0,dmgAcc:0,slow:0,walk:Math.random()*6,hit:0,killer:null};
}
function applyUpg(s,type){
  const info=upgInfo(s,type);
  sfx(type==='squad'?'squad':type==='giant'?'giant':type==='wave'?'wave':type==='fence'?'fence':s===G.P?'upgrade':'_',.05);
  if(type==='dmg'){s.dmgMul+=upInc(CFG.dmgUp,s.dmgPicks);s.dmgPicks++}
  else if(type==='rate'){s.rateMul+=upInc(CFG.rateUp,s.ratePicks);s.ratePicks++}
  else if(type==='doubles'){const d=CFG.doubles.dur+CFG.doubles.durStep*(s.rank.doubles-1);if(s.buff>0)s.buffQ.push(d);else{s.buff=d;s.buffMax=d}s.rank.doubles++}
  else if(type==='squad'){spawnArmy(s,false,Math.round(CFG.squad.base*Fr(s.rank.squad)));s.rank.squad++}
  else if(type==='giant'){spawnArmy(s,true,1);s.rank.giant++}
  else if(type==='wave'){const F=Fr(s.rank.wave);G.waves.push({side:s.id,dir:s.dir,z:s.front+s.dir*.4,F,hit:new Set(),done:false});s.rank.wave++}
  else if(type==='barrel'){G.barrels.push({side:s.id,dir:s.dir,x:0,z:s.front+s.dir*CFG.barrel.spawnOffset,roll:0,age:0,hp:CFG.barrel.hp,hit:0})}
  else if(type==='fence'){
    if(fencesOf(s.id)<CFG.fence.maxAlive){
      const C=CFG.fence,z1=s.id==='p'?C.zPlayer:C.zBot,z2=z1-s.dir*C.secondLine;
      const used=G.fences.filter(f=>f.side===s.id).map(f=>f.tz);
      const tz=used.includes(z1)?z2:z1;
      G.fences.push({side:s.id,dir:s.dir,x:0,z:s.front,tz,w:Math.min(C.widthMax,C.width*Fr(s.rank.fence)),hp:C.hp,max:C.hp,dmgAcc:0,hitT:0});
    }
    s.rank.fence++;
  }
  const yy=s===G.P?UI.pWall-36:UI.eWall+UI.wallH+26;
  floatPx(W/2,yy,(s===G.E?'Враг: ':'')+info.t+' '+info.v,UPG[type].col,s===G.P?15:12);
}

const SND={ac:null,on:true,last:{}};
// iOS: the ringer switch mutes Web Audio unless the page plays as "media".
// A silent looping <audio> started from a tap switches the session to playback.
function unlockIOS(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(SND.tag)return;
  try{const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    const a=document.createElement('audio');a.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));a.loop=true;a.setAttribute('playsinline','');a.volume=.01;
    const p=a.play();p&&p.catch&&p.catch(()=>{});SND.tag=a}catch(e){}
}
function audioInit(){
  unlockIOS();
  if(SND.ac){if(SND.ac.state!=='running')SND.ac.resume();
    if(!SND.primed){try{const o=SND.ac.createBufferSource();o.buffer=SND.ac.createBuffer(1,1,22050);o.connect(SND.ac.destination);o.start(0);SND.primed=true}catch(e){}}
    return}
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();SND.ac=ac;
    SND.out=ac.createGain();SND.out.gain.value=.55;
    const comp=ac.createDynamicsCompressor();SND.out.connect(comp);comp.connect(ac.destination);
    const n=ac.sampleRate,b=ac.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;SND.noise=b;
  }catch(e){SND.ac=null}
}
function tone(f0,f1,dur,type,vol,delay=0){
  const ac=SND.ac,t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(SND.out);o.start(t);o.stop(t+dur+.02);
}
function hiss(dur,vol,f0,f1,kind='lowpass',delay=0){
  const ac=SND.ac,t=ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=SND.noise;s.playbackRate.value=.6+Math.random()*.8;f.type=kind;f.Q.value=1.2;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(SND.out);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
function sfx(name,gap=.03){
  if(!SND.ac||!SND.on||paused)return;
  const now=SND.ac.currentTime;if(now-(SND.last[name]||0)<gap)return;SND.last[name]=now;
  const r=()=>1+Math.random()*.12-.06;
  switch(name){
    case'shot':hiss(.06,.06,6000*r(),1800,'bandpass');tone(900*r(),320,.04,'triangle',.022);break;
    case'treeHit':tone(260*r(),180,.05,'triangle',.06);break;
    case'tree':hiss(.22,.18,1800,300,'bandpass');tone(140,70,.18,'triangle',.12);break;
    case'goldTree':hiss(.22,.16,1800,300,'bandpass');[880,1175,1568].forEach((f,i)=>tone(f,f,.18,'triangle',.09,i*.05));break;
    case'flaskHit':hiss(.035,.14,2600*r(),1900,'bandpass');tone(1150*r(),1000,.05,'triangle',.035);tone(380,230,.045,'sine',.05);break;
    case'flask':hiss(.14,.32,7000,1600,'highpass');hiss(.07,.22,1600,500,'bandpass');tone(260,110,.07,'sine',.07);
      for(let i=0;i<16;i++){const f=3000+Math.random()*5500;hiss(.012+Math.random()*.03,.06+Math.random()*.09,f,f*.75,'bandpass',.02+Math.random()*.38)}break;
    case'upgrade':[523,659,784].forEach((f,i)=>tone(f,f*1.01,.16,'square',.05,i*.06));break;
    case'level':[523,659,784,1047].forEach((f,i)=>tone(f,f,.2,'triangle',.11,i*.08));break;
    case'unitDie':tone(500*r(),120,.09,'square',.035);break;
    case'giantDie':tone(160,40,.4,'sawtooth',.12);hiss(.35,.15,900,100);break;
    case'hitBase':tone(110*r(),60,.12,'sine',.12);hiss(.08,.05,600,200);break;
    case'squad':[392,494,587].forEach((f,i)=>tone(f,f,.1,'square',.05,i*.04));break;
    case'giant':tone(90,140,.35,'sawtooth',.12);tone(180,280,.35,'square',.04);break;
    case'wave':hiss(.7,.22,300,2400,'bandpass');tone(120,240,.5,'sine',.08);break;
    case'fence':tone(90,60,.2,'square',.1);hiss(.15,.12,500,150);break;
    case'rocket':hiss(.9,.18,400,2200,'bandpass');tone(200,600,.8,'sawtooth',.04);break;
    case'boom':tone(120,30,.6,'sine',.3);hiss(.7,.35,1500,80);break;
    case'tankShot':tone(180,60,.14,'square',.09);hiss(.1,.1,2000,400);break;
    case'blast':tone(140,40,.3,'sine',.18);hiss(.3,.18,2200,120);break;
    case'pop':hiss(.2,.15,2500,400);tone(300,80,.15,'square',.06);break;
    case'rush':[0,.32].forEach(d=>{tone(220,220,.28,'sawtooth',.12,d);tone(277,277,.28,'sawtooth',.08,d)});break;
    case'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.3,'triangle',.13,i*.11));break;
    case'lose':[392,349,311,262].forEach((f,i)=>tone(f,f*.98,.35,'triangle',.13,i*.16));break;
  }
}

function stepCannon(s,dt){
  const C=CFG.cannon;
  if(s===G.P){if(keyL)s.tx=s.x-1.2;if(keyR)s.tx=s.x+1.2;s.tx=clamp(s.tx,-C.xLimit,C.xLimit);
    s.x+=clamp(s.tx-s.x,-C.playerSpeed*dt,C.playerSpeed*dt)}
  else{botThink(s,dt);s.x+=(s.tx-s.x)*Math.min(1,dt*CFG.bot.smooth);s.x=clamp(s.x,-C.xLimit,C.xLimit)}
  if(s.buff>0){s.buff-=dt;if(s.buff<=0){s.buff=0;if(s.buffQ.length){s.buff=s.buffQ.shift();s.buffMax=s.buff}}}
  if(s.hitT>0)s.hitT-=dt;
  s.recoil=Math.max(0,s.recoil-dt*30);
  s.cd-=dt;
  while(s.cd<=0){
    s.cd+=C.interval/s.rateMul;s.recoil=3;s.flash=.09;if(s===G.P)sfx('shot',.05);
    const x=s.x+rnd(-C.jitter,C.jitter),dmg=C.dmg*s.dmgMul,b={side:s.id,z:s.muzzle,dz:s.dir*C.bulletSpeed,dist:0};
    if(s.buff>0){
      const D=CFG.doubles;
      G.bullets.push({...b,x:x-D.offset,dmg:dmg*D.dmgMul,noFlask:true},{...b,x:x+D.offset,dmg:dmg*D.dmgMul,noFlask:true},
        {...b,x,dmg,ghost:true});
    }else G.bullets.push({...b,x,dmg});
  }
  if(s.flasks.length===0&&s.pending>0){
    s.pending--;const types=drawPair(s),xs=placeFlasks(s);
    s.flasks=types.map((t,i)=>({type:t,x:xs[i],z:s.flaskZ,hp:CFG.flask.hp,hit:0,born:0}));
    s.choice=-1;
  }
  for(const f of s.flasks){f.born+=dt;if(f.hit>0)f.hit-=dt}
}

function botThink(s,dt){
  const B=CFG.bot;
  s.aiT-=dt;if(s.aiT>0)return;s.aiT=B.retarget;
  let tx=null;
  if(s.flasks.length){
    if(s.choice<0)s.choice=botChoose(s);
    tx=s.flasks[s.choice].x;
  }else{
    let threat=null,td=1e9;
    for(const u of G.units)if(u.side!==s.id){const d=Math.abs(u.z-s.front);if(d<B.threatDist&&d<td){td=d;threat=u}}
    if(threat)tx=threat.x;
    else{
      let best=null,bd=1e9;
      for(const t of G.trees)if(!t.dead){const d=Math.hypot(t.x-s.x,(t.z-s.muzzle)*.35);if(d<bd){bd=d;best=t}}
      tx=best?best.x:foeOf(s).x;
    }
  }
  s.tx=tx+rnd(-B.aimErr,B.aimErr);
}
function botChoose(s){
  const B=CFG.bot,S=B.score,foeId=s.id==='p'?'e':'p';
  const near=G.units.filter(u=>u.side===foeId&&Math.abs(u.z-s.front)<B.nearDist).length;
  const own=aliveUnits(s.id);
  const sc=s.flasks.map(f=>{const t=f.type;let v=(t==='dmg'||t==='rate')?S.cannon:S.other;
    if(s.style==='squad'&&t==='squad')v+=S.favorite;
    if(s.style==='giant'&&t==='giant')v+=S.favorite;
    if(s.style==='defense'&&(t==='fence'||t==='wave'))v+=S.styleFit;
    if(s.style==='economy'&&(t==='dmg'||t==='rate'))v+=S.styleFit;
    if(near>=6&&t==='wave')v+=S.wave6;
    if(near>=3&&t==='fence')v+=S.fence3;
    if(near>=3&&t==='squad')v+=S.squad3;
    if(own<5&&t==='squad')v+=S.squadLow;
    return v});
  if(Math.random()<B.bestChance)return sc[0]>=sc[1]?0:1;
  return Math.floor(Math.random()*2);
}

// ---- bullets: nearest target along the travel segment ----
function circleEntry(b,cx,cz,r,z0,travel){
  const dx=b.x-cx;if(Math.abs(dx)>=r)return null;
  const h=Math.sqrt(r*r-dx*dx),s=Math.sign(b.dz);
  const exit=(cz+s*h-z0)*s;if(exit<0)return null;
  const p=Math.max(0,(cz-s*h-z0)*s);return p<=travel?p:null;
}
function stepBullets(dt){
  const T=CFG.tree;
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i],owner=sideById(b.side),foe=foeOf(owner),z0=b.z,travel=Math.abs(b.dz*dt),s=Math.sign(b.dz);
    let best=null,bp=1e9;
    const consider=(p,kind,obj)=>{if(p!==null&&p<bp){bp=p;best={kind,obj}}};
    if(!b.noFlask)for(const f of owner.flasks)consider(circleEntry(b,f.x,f.z,CFG.flask.radius,z0,travel),'flask',f);
    if(!b.ghost){
      for(let zz=Math.min(z0,z0+s*travel)-.5;zz<=Math.max(z0,z0+s*travel)+.5;zz+=.5)
        for(const ox of[-.5,0,.5]){const a=G.grid.get(cellKey(b.x+ox,zz));if(a)for(const t of a)if(!t.dead)consider(circleEntry(b,t.x,t.z,T.radius,z0,travel),'tree',t)}
      for(const u of G.units)if(u.side!==b.side&&u.hp>0)consider(circleEntry(b,u.x,u.z,u.r,z0,travel),'unit',u);
      for(const r of G.rockets)if(r.side!==b.side){
        const R=CFG.rocket,dx=b.x-r.x;if(Math.abs(dx)<R.radius){const h=R.halfLen+Math.sqrt(R.radius*R.radius-dx*dx);
          const exit=(r.z+s*h-z0)*s;if(exit>=0){const p=Math.max(0,(r.z-s*h-z0)*s);if(p<=travel)consider(p,'rocket',r)}}}
      for(const br of G.barrels)if(br.side!==b.side&&!br.done)consider(circleEntry(b,br.x,br.z,CFG.barrel.radius+.08,z0,travel),'barrel',br);
      for(const p of G.peds)if(!p.dead)consider(circleEntry(b,p.x,p.z,CFG.pedestal.radius,z0,travel),'ped',p);
      for(const f of G.fences)if(f.side!==b.side&&Math.abs(b.x-f.x)<f.w/2){
        const face=f.z-s*CFG.fence.thick,p=(face-z0)*s;if(p>=-CFG.fence.thick*2&&p<=travel)consider(Math.max(0,p),'fence',f)}
      const pb=(foe.front-z0)*s;if(pb<=travel)consider(Math.max(0,pb),'base',foe);
    }
    if(!best){b.z+=b.dz*dt;b.dist+=travel;if(b.dist>CFG.cannon.range)G.bullets.splice(i,1);continue}
    G.bullets.splice(i,1);
    const o=best.obj,hz=z0+s*bp;
    if(!b.ghost)FX.push({x:sx(b.x),y:sy(hz),t:0,life:.28,rot:Math.random()*6.28,big:best.kind==='base'||best.kind==='tree'&&o.hp<=0});
    switch(best.kind){
      case'flask':o.hp-=b.dmg;o.hit=.12;if(owner===G.P)sfx(o.hp<=0?'flask':'flaskHit',.02);
        if(o.hp<=0){const t=o.type;
          if(owner===G.P){burst(o.x,o.z,UPG[t].col,22);for(const f of owner.flasks)if(f!==o)burst(f.x,f.z,'#9aa0aa',10)}
          owner.flasks=[];applyUpg(owner,t)}
        break;
      case'tree':o.hp-=b.dmg;o.hit=.12;if(o.hp<=0){if(owner===G.P)sfx(o.g?'goldTree':'tree',.05)}else if(owner===G.P)sfx('treeHit',.06);
        if(o.hp<=0){o.dead=true;const v=o.g?T.golden.gold:T.green.gold;addGold(owner,v);
          burst(o.x,o.z,o.g?'#ffb21a':'#45b142',o.g?16:10);
          if(owner===G.P)float(o.x,o.z,'+'+v,o.g?'#ffb21a':'#45b142',o.g?15:12)}
        break;
      case'unit':o.dmgAcc+=b.dmg;o.killer=b.side;o.hit=.1;break;
      case'rocket':o.hp-=b.dmg;o.hit=.1;if(o.hp<=0){o.dead=true;sfx('pop',.05);burst(o.x,o.z,'#ff8a3a',20)}break;
      case'barrel':if(o.hp===undefined)o.hp=CFG.barrel.hp;o.hp-=b.dmg;o.hit=.12;if(o.hp<=0){o.done=true;burst(o.x,o.z,'#a8462a',14);burst(o.x,o.z,'#222',8);sfx('pop',.05)}break;
      case'ped':o.hp-=b.dmg;o.hit=.12;if(o.hp<=0){o.dead=true;burst(o.x,o.z,'#c33',20);launchRocket(owner,o)}break;
      case'fence':o.dmgAcc+=b.dmg;o.hitT=.1;break;
      case'base':damageBase(o,b.dmg,b.x);break;
    }
  }
}
function launchRocket(s,p){
  G.rockets.push({side:s.id,dir:s.dir,x0:p.x,x:p.x,z:p.z,age:0,phase:Math.random()*6.283,hp:CFG.rocket.hp,ang:0,hit:0,dead:false});
  sfx('rocket',.1);float(p.x,p.z-1,s===G.P?'РАКЕТА!':'Вражеская ракета!',s===G.P?'#4aa8ff':'#ff4d4d',14);
}
function stepRockets(dt){
  const R=CFG.rocket;
  for(const r of G.rockets){
    if(r.hit>0)r.hit-=dt;
    r.age+=dt;const ox=r.x;
    r.x=r.x0+R.wobble*(Math.sin(r.age*R.wobbleFreq+r.phase)-Math.sin(r.phase));
    r.z+=r.dir*R.speed*dt;
    r.ang=Math.atan2((r.x-ox)*PX,-(r.dir*R.speed*dt)*PZ);
    const foe=r.side==='p'?G.E:G.P;
    if((foe.front-r.z)*r.dir<=R.halfLen){damageBase(foe,R.dmg,r.x);sfx('boom',.05);burst(r.x,foe.front,'#ff8a3a',30);
      floatPx(sx(r.x),sy(foe.front)+(r.dir>0?-20:20),'-'+R.dmg,'#ff8a3a',20);r.dead=true}
  }
  G.rockets=G.rockets.filter(r=>!r.dead);
}

// ---- armies ----
function stepArmies(dt){
  const S=CFG.soldier,Gc=CFG.giant,A=CFG.army,FC=CFG.fence;
  // release reserve
  for(const s of[G.P,G.E]){let n=0;while(s.reserve.length&&n<A.releasePerStep&&aliveUnits(s.id)<A.limit){G.units.push(makeUnit(s,s.reserve.shift()));n++}}
  const units=G.units;
  // phase 1: decide from one snapshot
  const baseHits=[];
  for(const u of units){
    const dir=u.side==='p'?-1:1,foe=u.side==='p'?G.E:G.P;
    u.cd=Math.max(0,u.cd-dt);if(u.hit>0)u.hit-=dt;if(u.slow>0)u.slow-=dt;if(u.fire>0)u.fire-=dt;if(u.atkT>0)u.atkT-=dt;
    u.act=null;
    if(u.giant){
      // tank-giant: crushes up to 4 enemies right in front (slow melee), gun fires every 2 s
      const tg=[];
      for(const o of units)if(o.side!==u.side){const fw=(o.z-u.z)*dir,dx=Math.abs(o.x-u.x);
        if(fw>=Gc.frontMin&&fw<=Gc.frontMax+o.r&&dx<Gc.side+o.r)tg.push([Math.hypot(o.x-u.x,o.z-u.z),o])}
      if(tg.length){tg.sort((a,b)=>a[0]-b[0]);u.act={units:tg.slice(0,Gc.maxTargets).map(t=>t[1])}}
      u.gunCd=(u.gunCd??Gc.gun.interval*.5)-dt;
      if(u.gunCd<=0){u.gunCd+=Gc.gun.interval;u.fire=.2;sfx('tankShot',.05);
        G.shells.push({side:u.side,dir,x:u.x,z:u.z+dir*u.r,dmg:u.dmg*Gc.gun.dmgMul,dist:0})}
    }else{
      let best=null,bd=1e9;
      for(const o of units)if(o.side!==u.side){const fw=(o.z-u.z)*dir;if(fw<-u.r)continue;
        const d=Math.hypot(o.x-u.x,o.z-u.z);if(d<=u.r+o.r+S.engage&&d<bd){bd=d;best=o}}
      if(best)u.act={units:[best]};
      else{let c=null,cd=S.aggro;for(const o of units)if(o.side!==u.side&&Math.abs(o.x)<CFG.tree.roadHalf+.15&&(o.z-u.z)*dir>-.05){const d=Math.hypot(o.x-u.x,o.z-u.z);if(d<cd){cd=d;c=o}}u.chase=c}
    }
    if(!u.act)for(const f of G.fences)if(f.side!==u.side&&Math.abs(u.x-f.x)<f.w/2+u.r){
      const gap=(f.z-u.z)*dir-u.r-FC.thick;if(gap<=S.engage&&gap>-FC.thick*2){u.act={fence:f};break}}
    if(!u.act){const gap=(foe.front-u.z)*dir-u.r-A.baseGap;if(gap<=.02)u.act={base:foe}}
    if(u.act&&u.cd<=0){
      u.cd=u.atk;
      if(u.giant){
        if(u.act.units)for(const o of u.act.units){o.dmgAcc+=u.dmg;o.killer=u.side;o.hit=.1}
        else if(u.act.fence){u.act.fence.dmgAcc+=u.dmg;u.act.fence.hitT=.1}
        else if(u.act.base)baseHits.push([u.act.base,u.dmg,u.x]);
      }else{
        const t=u.act.units?u.act.units[0]:null;u.atkT=.2;
        if(t){const d=Math.hypot(t.x-u.x,t.z-u.z)||1;u.ax=(t.x-u.x)/d;u.az=(t.z-u.z)/d}else{u.ax=0;u.az=dir}
      if(u.act.units)for(const o of u.act.units){o.dmgAcc+=u.giant?u.dmg:S.dmgUnit;o.killer=u.side;o.hit=.1}
      else if(u.act.fence){u.act.fence.dmgAcc+=u.giant?u.dmg:S.dmgFence;u.act.fence.hitT=.1}
      else baseHits.push([u.act.base,u.giant?u.dmg:S.dmgBase,u.x]);
      }
    }
    // movement intent
    let dvx=0,dvz=0;
    if(!u.act||u.giant){
      const sp=u.spd*(u.slow>0?CFG.wave.slow:1)*oilMul(u);dvz=dir*sp;
      const RH=CFG.tree.roadHalf,inForest=u.z>CFG.tree.zMin-.3&&u.z<CFG.tree.zMax+.3,ax=Math.abs(u.x);
      // keep to the road: soft pull to the middle, strong sideways slide when touching the trees
      if(inForest){
        if(ax>RH-u.r){dvx=-Math.sign(u.x)*sp;dvz*=.35}
        else if(ax>RH*.45)dvx=-Math.sign(u.x)*sp*.35*(ax-RH*.45)/(RH*.55);
      }else if(ax>RH-u.r)dvx=-Math.sign(u.x)*sp*.8;
      if(!u.giant&&!u.act&&u.chase&&u.chase.hp>0&&!(u.unstick>0)){const dx=u.chase.x-u.x,dz=u.chase.z-u.z,d=Math.hypot(dx,dz)||1;dvx=dx/d*sp*1.15;dvz=dz/d*sp*1.15}
      // stuck: no progress for a while -> slide to the road centre, half-step back allowed
      u.chkT=(u.chkT||0)+dt;
      if(u.chkT>=.4){const moved=Math.hypot(u.x-(u.cx??u.x),u.z-(u.cz??u.z));
        if(moved<sp*.4*.3&&!(u.slow>0)&&inForest&&ax>RH*.6)u.unstick=.8;u.cx=u.x;u.cz=u.z;u.chkT=0}
      if(u.unstick>0){u.unstick-=dt;const side=Math.abs(u.x)>.05?-Math.sign(u.x):(Math.random()<.5?-1:1);
        dvx=side*sp*1.1;dvz=dir*sp*.3}
      if(dvz*dir<0)dvz=0; // never walk back toward own base
    }
    const k=Math.min(1,dt*8);u.vx+=(dvx-u.vx)*k;u.vz+=(dvz-u.vz)*k;
    u.x+=u.vx*dt;u.z+=u.vz*dt;
    if(u.kz){u.z+=u.kz*dt;u.kz*=Math.exp(-CFG.wave.knockDecay*dt);if(Math.abs(u.kz)<.01)u.kz=0}
    if(!u.act)u.walk+=dt*(u.giant?7:12);
  }
  // waves
  for(const w of G.waves){
    const Wc=CFG.wave;w.z+=w.dir*Wc.speed*dt;
    for(const u of units)if(u.side!==w.side&&!w.hit.has(u)&&Math.abs(u.z-w.z)<Wc.length/2+u.r&&Math.abs(u.x)<Wc.hitHalf+u.r){
      w.hit.add(u);u.dmgAcc+=Wc.dmg*w.F;u.killer=w.side;u.hit=.15;u.kz=(u.kz||0)+w.dir*Wc.push*Math.min(Wc.pushFMax,w.F)*Wc.knockDecay/u.m;u.slow=Wc.slowDur}
    const foe=w.side==='p'?G.E:G.P;
    if((foe.front-w.z)*w.dir<=Wc.length/2){baseHits.push([foe,Wc.dmg*w.F,0]);w.done=true}
  }
  G.waves=G.waves.filter(w=>!w.done);
  // fences slide into place
  for(const f of G.fences){const d=f.tz-f.z;f.z+=clamp(d,-FC.speed*dt,FC.speed*dt);if(f.hitT>0)f.hitT-=dt}
  // phase 2: soft separation
  for(let it=0;it<A.sepIters;it++){
    for(let i=0;i<units.length;i++){const a=units[i];
      for(let j=i+1;j<units.length;j++){const b=units[j],rr=a.r+b.r,dx=b.x-a.x,dz=b.z-a.z;
        if(dx>rr||dx<-rr||dz>rr||dz<-rr)continue;const d=Math.hypot(dx,dz)||.001;
        if(d<rr){const o=(rr-d)*.5,nx=dx/d,nz=dz/d,ms=a.m+b.m;
          a.x-=nx*o*b.m/ms;a.z-=nz*o*b.m/ms;b.x+=nx*o*a.m/ms;b.z+=nz*o*a.m/ms}}}
  }
  // phase 3: obstacles, fences, bounds
  for(const u of units){
    const dir=u.side==='p'?-1:1;
    for(let ix=-1;ix<=1;ix++)for(let iz=-1;iz<=1;iz++){const a=G.grid.get(cellKey(u.x+ix*.5,u.z+iz*.5));if(!a)continue;
      for(const t of a){if(t.dead)continue;const dx=u.x-t.x,dz=u.z-t.z,rr=u.r+CFG.tree.radius;
        if(dx>rr||dx<-rr||dz>rr||dz<-rr)continue;const d=Math.hypot(dx,dz)||.001;if(d<rr){u.x+=dx/d*(rr-d);u.z+=dz/d*(rr-d)}}}
    for(const p of G.peds)if(!p.dead){const dx=u.x-p.x,dz=u.z-p.z,rr=u.r+CFG.pedestal.radius,d=Math.hypot(dx,dz)||.001;if(d<rr){u.x+=dx/d*(rr-d);u.z+=dz/d*(rr-d)}}
    for(const f of G.fences)if(f.side!==u.side&&Math.abs(u.x-f.x)<f.w/2+u.r*.5){
      const lim=f.z-dir*(u.r+FC.thick);if((u.z-lim)*dir>0&&(f.z-u.z)*dir>-FC.thick*3)u.z=lim}
    const foe=u.side==='p'?G.E:G.P,own=u.side==='p'?G.P:G.E;
    const stop=foe.front-dir*(u.r+A.baseGap);if((u.z-stop)*dir>0)u.z=stop;
    const back=own.front+dir*u.r;if((u.z-back)*dir<0)u.z=back;
    u.x=clamp(u.x,-3.5+u.r,3.5-u.r);
  }
  // phase 4: apply all damage together
  for(const[s,v,x]of baseHits)damageBase(s,v,x);
  for(const u of units){if(u.dmgAcc>0){u.hp-=u.dmgAcc;u.dmgAcc=0}}
  for(const f of G.fences){if(f.dmgAcc>0){f.hp-=f.dmgAcc;f.dmgAcc=0}if(f.hp<=0){f.dead=true;burst(f.x,f.z,'#9aa0aa',24)}}
  G.fences=G.fences.filter(f=>!f.dead);
  for(const u of units)if(u.hp<=0&&!u.gone){u.gone=true;
    const killer=sideById(u.killer||(u.side==='p'?'e':'p'));
    addGold(killer,u.giant?CFG.killGold.giant:CFG.killGold.soldier);
    burst(u.x,u.z,u.side==='p'?'#6cc4ff':'#ff4d4d',u.giant?24:7);sfx(u.giant?'giantDie':'unitDie',u.giant?.05:.04)}
  G.units=units.filter(u=>!u.gone);
}

function stepShells(dt){
  const g=CFG.giant.gun;
  for(const sh of G.shells){
    if(sh.tx!==undefined){sh.done=true;continue} // drop old splash shells from before the update
    const st=g.speed*dt;sh.z+=sh.dir*st;sh.dist+=st;
    for(const o of G.units)if(o.giant&&o.side!==sh.side&&Math.abs(o.x-sh.x)<o.r+g.hitPad&&Math.abs(o.z-sh.z)<o.r+st){
      o.dmgAcc+=sh.dmg;o.killer=sh.side;o.hit=.12;sh.done=true;burst(sh.x,sh.z,'#ffd21f',8);sfx('blast',.04);break}
    if(sh.done)continue;
    for(const f of G.fences)if(f.side!==sh.side&&Math.abs(sh.x-f.x)<f.w/2){const p=(f.z-sh.dir*CFG.fence.thick-sh.z)*sh.dir;
      if(p<=0&&p>-st-CFG.fence.thick*2){f.dmgAcc+=sh.dmg;f.hitT=.12;sh.done=true;burst(sh.x,f.z,'#ffd21f',8);sfx('blast',.04);break}}
    if(sh.done)continue;
    const foe=sh.side==='p'?G.E:G.P;
    if((foe.front-sh.z)*sh.dir<=0){damageBase(foe,sh.dmg,sh.x);sh.done=true;burst(sh.x,foe.front,'#ffd21f',8);sfx('blast',.04)}
    else if(sh.dist>g.range)sh.done=true;
  }
  G.shells=G.shells.filter(s=>!s.done);
  for(const b of G.booms)b.t+=dt;G.booms=G.booms.filter(b=>b.t<.45);
}
function oilMul(u){for(const o of G.slicks)if(o.side!==u.side&&Math.hypot(u.x-o.x,u.z-o.z)<o.r+u.r*.5)return CFG.barrel.slowMul;return 1}
function stepBarrels(dt){
  const C=CFG.barrel;
  for(const b of G.barrels){
    if(b.done)continue;if(b.hit>0)b.hit-=dt;
    const st=C.speed*dt;b.z+=b.dir*st;b.roll+=st;b.age+=dt;
    const foe=b.side==='p'?G.E:G.P;let hit=false;
    for(const u of G.units)if(u.side!==b.side&&Math.hypot(u.x-b.x,u.z-b.z)<u.r+C.radius){hit=true;break}
    if(!hit)for(const f of G.fences)if(f.side!==b.side&&Math.abs(b.x-f.x)<f.w/2+C.radius&&(f.z-b.z)*b.dir<=C.radius+CFG.fence.thick){hit=true;break}
    if(!hit&&(foe.front-b.z)*b.dir<=C.radius)hit=true;
    if(!hit)continue;

function step(dt){

  stepBullets(dt);stepRockets(dt);stepShells(dt);stepBarrels(dt);stepArmies(dt);
  const R=CFG.rush;
  if(!G.rush){const alive=G.trees.reduce((a,t)=>a+(t.dead?0:1),0);
    if(G.time>=R.time||G.P.hp<=R.baseHp||G.E.hp<=R.baseHp||alive<=R.treesLeft*G.treesInit){G.rush=true;G.rushT=0;sfx('rush')}}

}
function frame(realDt){
  for(const t of G.texts)t.t+=realDt;G.texts=G.texts.filter(t=>t.t<1.2);
  for(const p of G.parts){p.t+=realDt;p.x+=p.vx*realDt;p.y+=p.vy*realDt;p.vx*=.92;p.vy*=.92}G.parts=G.parts.filter(p=>p.t<p.life);

  while(acc>=dt&&n<CFG.sim.maxSteps){step(dt);acc-=dt;n++;if(G.state!=='play')break}

  for(const t of G.trees){
    while(pi<peds.length&&peds[pi].z<t.z){drawPed(peds[pi]);pi++}
    if(t.dead)continue;
    const sq=t.hit>0?Math.sin(t.hit*60)*.08:0,k=.88+.12*t.hp/t.max;
    FLASH=t.hit>0?t.hit/.12:0;spr(t.g?'treeY':'treeG',sx(t.x),sy(t.z)+7,21*k*(1+sq),.5,.85,0,1-sq);FLASH=0;
  }
  while(pi<peds.length){drawPed(peds[pi]);pi++}
  drawWall(G.E);drawWall(G.P);drawExp();
  for(const f of G.P.flasks)drawFlask(f);
  for(const f of G.fences)drawFence(f);
  for(const w of G.waves)drawWave(w);
  for(const b of G.barrels){const x=sx(b.x),y=sy(b.z),bob=Math.abs(Math.sin(b.roll*7))*2;
    ctx.fillStyle='rgba(60,55,45,.22)';ctx.beginPath();ctx.ellipse(x,y+14,22,7,0,0,7);ctx.fill();
    drawBarrelShape(x,y-bob*2,44,b.roll,'',false,b.hit>0?1:0)}
  const foot=u=>sy(u.z)+(u.giant?GIANT_PX*u.vis*.38:5);
  const us=G.units.slice().sort((a,b)=>foot(a)-foot(b));for(const u of us)drawUnit(u);
  for(const b of G.bullets)if(!b.ghost){const x=sx(b.x),y=sy(b.z),d=Math.sign(b.dz),L=Math.min(85,b.dist*PZ);
    const g=ctx.createLinearGradient(x,y,x,y-d*L);g.addColorStop(0,'rgba(255,230,120,.85)');g.addColorStop(1,'rgba(255,200,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-4.5,y);ctx.lineTo(x+4.5,y);ctx.lineTo(x+1,y-d*L);ctx.lineTo(x-1,y-d*L);ctx.fill();
    ctx.fillStyle='rgba(255,255,240,.7)';ctx.beginPath();ctx.moveTo(x-1.6,y);ctx.lineTo(x+1.6,y);ctx.lineTo(x,y-d*L*.6);ctx.fill();
    spr('bullet',x,y,10,.5,.5,d>0?Math.PI:0)}
  for(const o of G.slicks){const x=sx(o.x),y=sy(o.z),life=CFG.barrel.slickTime,a=Math.min(1,o.t*3)*Math.min(1,(life-o.t)/.8);if(a<=0)continue;
    // glow + embers
    ctx.globalAlpha=.35*a;const gr=ctx.createRadialGradient(x,y,2,x,y,o.r*PX);gr.addColorStop(0,'rgba(255,150,40,.9)');gr.addColorStop(1,'rgba(255,90,20,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(x,y,o.r*PX,o.r*PZ*.85,0,0,7);ctx.fill();
    for(let i=0;i<26;i++){const ph=((G.time*.9+i*.137+o.seed)%1),ang=o.seed*3.1+i*2.39996,rad=Math.sqrt((i*.381+o.seed)%1)*.85;
      const ex=x+Math.cos(ang)*o.r*PX*rad+Math.sin(G.time*4+i)*3,ey=y+Math.sin(ang)*o.r*PZ*rad*.85-ph*34;
      ctx.globalAlpha=a*(1-ph);ctx.fillStyle=i%3?'#ffb21a':'#fff2b0';ctx.fillRect(ex-1.3,ey-1.3,2.6,2.6)}
    for(let i=0;i<24;i++){const ang=o.seed*7.3+i*2.39996,rad=Math.sqrt(((o.seed*13.7+i*.618)%1))*.85,
      fx=x+Math.cos(ang)*o.r*PX*rad,fy=y+Math.sin(ang)*o.r*PZ*rad*.85,t=G.time*9+i*1.7,
      fh=(11+6*Math.sin(t)+4*Math.sin(t*2.3))*a*(1.15-rad*.4),fw=(5+1.5*Math.sin(t*1.3))*a;
      ctx.globalAlpha=.9*a;ctx.fillStyle='#ff6a1a';ctx.beginPath();ctx.moveTo(fx-fw,fy);ctx.quadraticCurveTo(fx-fw*.6,fy-fh*.6,fx+Math.sin(t)*2,fy-fh);
      ctx.quadraticCurveTo(fx+fw*.6,fy-fh*.6,fx+fw,fy);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(fx-fw*.5,fy);ctx.quadraticCurveTo(fx-fw*.3,fy-fh*.4,fx+Math.sin(t)*1.2,fy-fh*.6);
      ctx.quadraticCurveTo(fx+fw*.3,fy-fh*.4,fx+fw*.5,fy);ctx.closePath();ctx.fill()}
    ctx.globalAlpha=1}
  drawFX();
  for(const sh of G.shells)if(sh.dir)spr('bullet',sx(sh.x),sy(sh.z),10,.5,.5,sh.dir>0?Math.PI:0);
  for(const b of G.booms){const k=b.t/.45,R=b.r||.6,x=sx(b.x),y=sy(b.z),e=1-Math.pow(1-Math.min(1,k*2.2),3);
    ctx.fillStyle=`rgba(255,150,40,${.45*(1-k)})`;ctx.beginPath();ctx.ellipse(x,y,R*PX*e,R*PZ*e,0,0,7);ctx.fill();
    ctx.strokeStyle=`rgba(255,240,180,${1-k})`;ctx.lineWidth=3*(1-k)+1;ctx.beginPath();ctx.ellipse(x,y,R*PX*e,R*PZ*e,0,0,7);ctx.stroke();
    if(k<.35){ctx.fillStyle=`rgba(255,250,210,${1-k/.35})`;ctx.beginPath();ctx.arc(x,y,10*(1-k),0,7);ctx.fill()}}
  for(const r of G.rockets)drawRocket(r);
  drawTank(G.E);drawTank(G.P);
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  for(const t of G.texts){ctx.globalAlpha=1-Math.max(0,t.t-.6)/.6;outlined(t.txt,t.x,t.y-t.t*30,t.size,t.col)}
  ctx.globalAlpha=1;
  if(G.rush&&G.rushT<2.6){const a=G.rushT<.25?G.rushT/.25:G.rushT>2.1?(2.6-G.rushT)/.5:1,sc=1+Math.max(0,.35-G.rushT)*1.5;
    ctx.globalAlpha=a;ctx.save();ctx.translate(W/2,sy(CFG.tree.midZ));ctx.scale(sc,sc);outlined('НАТИСК',0,0,48,'#ff4d3a','#22252c',8);ctx.restore();ctx.globalAlpha=1}
  spr('pause',UI.pause.x,UI.pause.y,UI.pause.s);
  if(fsOK()){const b=FS,h=b.s/2;ctx.fillStyle='#22252c';rr(b.x-h,b.y-h,b.s,b.s,10);ctx.fill();ctx.fillStyle='#f6e7c8';rr(b.x-h+2.5,b.y-h+2.5,b.s-5,b.s-7,8);ctx.fill();
    ctx.strokeStyle='#1f6fd6';ctx.lineWidth=3.2;ctx.lineCap='round';const o=isFS()?4:9,i=isFS()?9:4,c=(sx_,sy_)=>{ctx.beginPath();ctx.moveTo(b.x+sx_*o,b.y+sy_*i);ctx.lineTo(b.x+sx_*o,b.y+sy_*o);ctx.lineTo(b.x+sx_*i,b.y+sy_*o);ctx.stroke()};
    const k=isFS()?1:1;c(-1,-1);c(1,-1);c(-1,1);c(1,1)}
  if(!started){ctx.fillStyle='rgba(20,22,28,.55)';ctx.fillRect(0,0,W,H);
    outlined('ЛЕСНАЯ ДУЭЛЬ',W/2,H/2-40,38,'#ffd21f','#22252c',7);
    const pulse=1+Math.sin(performance.now()/250)*.05;ctx.save();ctx.translate(W/2,H/2+20);ctx.scale(pulse,pulse);outlined('Нажми, чтобы играть',0,0,20,'#fff');ctx.restore();
    outlined('на весь экран и со звуком',W/2,H/2+50,13,'#e8efe9');return}
  if(G.state!=='play'||paused){
    ctx.fillStyle='rgba(20,22,28,.6)';ctx.fillRect(0,0,W,H);
    if(paused){outlined('ПАУЗА',W/2,H/2-60,40,'#fff');
      const btn=(y,txt,c1,c2)=>{ctx.fillStyle='#22252c';rr(W/2-95,y-24,190,48,14);ctx.fill();ctx.fillStyle=c1;rr(W/2-92,y-21,184,40,11);ctx.fill();
        ctx.fillStyle=c2;rr(W/2-92,y-21,184,14,11);ctx.fill();outlined(txt,W/2,y,18,'#fff')};
      btn(H/2+10,'Продолжить','#2f9b3f','#45c457');btn(H/2+70,'Заново','#c9452f','#ec6a4f')}
    else{outlined(G.state==='win'?'ПОБЕДА':'ПОРАЖЕНИЕ',W/2,H/2-14,42,G.state==='win'?'#ffd21f':'#ff5a5a','#22252c',6);
      outlined('Нажми, чтобы сыграть ещё',W/2,H/2+30,15,'#fff')}
  }
}

let last=performance.now();
function loop(now){const d=Math.min(.1,(now-last)/1000);last=now;if(!paused&&started)frame(d);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
